<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<title>Rondes parkings</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#1d3557; --navy-2:#2b4a75; --accent:#d9731a; --bg:#f3f5f8; --card:#fff;
  --ink:#1b2430; --muted:#5d6b7c; --line:#d9dee6;
  --ok:#23824f; --ok-bg:#e3f4ea; --warn:#a86a00; --warn-bg:#fff2d6; --bad:#b3261e; --bad-bg:#fbe4e2;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;
  padding:12px 16px calc(12px) 16px;display:flex;align-items:center;gap:10px;min-height:56px}
header.top h1{font-size:19px;margin:0;font-weight:650;flex:1;line-height:1.2}
header.top .tag{font-size:12px;background:rgba(255,255,255,.16);padding:3px 8px;border-radius:99px;white-space:nowrap}
header.top button.back{background:none;border:0;color:#fff;font-size:26px;padding:0 8px 0 0;min-height:auto;width:auto;line-height:1}
main{padding:14px 16px 90px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 8px;color:var(--navy);text-transform:uppercase;letter-spacing:.03em}
.card h3{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted);font-size:15px}
.small{font-size:13px}
button,.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;
  border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:600;
  padding:10px 14px;margin:8px 0 0;cursor:pointer;text-decoration:none;text-align:center}
button:active{transform:translateY(1px)}
button.big{min-height:76px;font-size:20px}
button.sec,.btn.sec{background:#e8edf4;color:var(--navy)}
button.accent{background:var(--accent)}
button.ok{background:var(--ok)}
button.danger{background:var(--bad)}
button.link{background:none;color:var(--navy);text-decoration:underline;min-height:40px;font-weight:500}
button:disabled{opacity:.45}
.row{display:flex;gap:8px}
.row > *{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{width:auto;min-height:44px;margin:0;padding:8px 14px;justify-content:flex-start;text-align:left;border-radius:99px;background:#e8edf4;color:var(--ink);font-weight:500;border:2px solid transparent}
.chip.on{background:var(--navy);color:#fff}
.chip.on-ok{background:var(--ok);color:#fff}
.chip.on-warn{background:var(--warn);color:#fff}
.chip.on-bad{background:var(--bad);color:#fff}
label.f{display:block;font-weight:600;margin:14px 0 4px}
input[type=text],input[type=password],input[type=tel],input[type=email],input[type=datetime-local],input[type=number],input[type=search],input[type=date],textarea,select{
  width:100%;font:inherit;padding:12px;border:1px solid #b9c2cf;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;vertical-align:middle;margin-left:4px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:#e5ecf6;color:var(--navy)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs .t{position:relative}
.thumbs .t button{position:absolute;top:-8px;right:-8px;width:30px;min-height:30px;height:30px;border-radius:99px;padding:0;margin:0;background:var(--bad);font-size:16px}
.photo-full{width:100%;border-radius:10px;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.stat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat b{font-size:20px}
.list-item{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400;min-height:auto;padding:12px}
.list-item .l1{font-weight:650}
.banner{border-radius:10px;padding:12px;margin:0 0 12px;font-size:15px}
.banner.ok{background:var(--ok-bg);color:#14532f} .banner.warn{background:var(--warn-bg);color:#5c3d00} .banner.bad{background:var(--bad-bg);color:#6d1712}
.banner.info{background:#e5ecf6;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2430;color:#fff;
  padding:12px 18px;border-radius:10px;z-index:50;max-width:calc(100% - 32px);font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:40;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;padding:24px;text-align:center}
.scanner{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:3/4;max-height:65vh;margin:0 auto}
.scanner video{width:100%;height:100%;object-fit:cover}
.scanner .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px}
.qr svg{width:100%;height:auto;max-width:420px;display:block;margin:8px auto;background:#fff}
.verdicts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.verdicts button{margin:0;min-height:56px;font-size:15px;padding:6px;background:#e8edf4;color:var(--ink)}
.verdicts button.sel-resolu{background:var(--ok);color:#fff}
.verdicts button.sel-encours{background:var(--warn);color:#fff}
.verdicts button.sel-aggrave{background:var(--bad);color:#fff}
.chk{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .lbl{flex:1;font-weight:500}
.chk button{width:auto;margin:0;min-height:46px;padding:6px 12px;background:#e8edf4;color:var(--ink)}
.chk button.sel-ras{background:var(--ok);color:#fff}
.chk button.sel-ano{background:var(--bad);color:#fff}
.sticky-bottom{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:16px 16px calc(14px + env(safe-area-inset-bottom));z-index:4}
.sticky-bottom > div{max-width:760px;margin:0 auto}
.foot{margin-top:24px;text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.compteur{font-size:64px;font-weight:800;text-align:center;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
button.plus1{min-height:110px;font-size:26px;background:var(--navy);border-radius:16px;margin-top:6px}
.plaque{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.05em;border:2px solid #1b2430;border-radius:6px;padding:1px 8px;background:#fff;color:#1b2430}
.chk .lbl .badge{margin-left:0;margin-top:2px}
.chk button{white-space:nowrap}
.sticky-bottom button{margin-top:6px}
/* PC (superviseur) : pleine largeur */
body.large main{max-width:1320px}
.filtres{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.filtres select,.filtres input{width:auto;flex:1 1 200px;min-width:0}
.filtres input[type=date]{flex:0 1 170px}
.vignette{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:#e8edf4}
.list-item.sel{border:2px solid var(--navy);background:#eef3fa}
.list-item .badge{margin:2px 4px 2px 0}
@media (min-width:1000px){
  .split{display:grid;grid-template-columns:420px 1fr;gap:16px;align-items:start}
  .pane-list{max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:68px;padding-right:4px}
  .pane-list .list-item{margin-top:6px}
}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in;border:1px solid var(--line)}
.gallery.grande{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
/* Interface agents (2.0) : grands boutons, une question par écran */
body.agent{font-size:18px}
.tuile{justify-content:flex-start;gap:16px;min-height:84px;font-size:21px;text-align:left;padding:14px 18px;margin-top:12px}
.tuile.principal{background:var(--navy)}
.tuile.sec{background:#e8edf4;color:var(--navy)}
.tuile.accent{background:var(--accent)}
.tuile-ico{display:flex;flex:none}
.card.encours{border:2px solid var(--accent)}
.grand{font-size:22px;font-weight:700;margin:2px 0}
.question{font-size:20px;font-weight:650;margin:16px 0 6px;line-height:1.3}
button.choix{background:#fff;color:var(--ink);border:2px solid var(--line);justify-content:flex-start;text-align:left;min-height:64px;font-size:19px;font-weight:600;margin-top:10px}
button.choix.on{border-color:var(--navy);background:#e8edf4}
.etapes{margin:0 0 8px}
.etapes-txt{font-size:15px;color:var(--muted)}
.etapes-txt b{color:var(--ink)}
.etapes-barre{display:flex;gap:4px;margin-top:6px}
.etapes-barre span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.etapes-barre span.fait{background:var(--ok)}
.etapes-barre span.en-cours{background:var(--accent)}
.compte-etape{font-size:16px;font-weight:650;color:var(--navy);margin:8px 0 6px}
.card.point{padding:18px}
.card.point h2{font-size:25px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 6px}
.point-detail{font-size:19px;margin:0 0 6px}
.card.point.nc{border:2px solid var(--bad)}
.card.point.c{border:2px solid var(--ok)}
button.case{background:#fff;color:var(--ink);border:2px solid var(--line);justify-content:flex-start;min-height:60px;font-size:19px;margin-top:8px;gap:14px}
button.case .coche{width:32px;height:32px;border:2px solid var(--muted);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex:none}
button.case.on{border-color:var(--navy)}
button.case.on .coche{background:var(--navy);border-color:var(--navy)}
button.case.urgent.on{border-color:var(--bad)}
button.case.urgent.on .coche{background:var(--bad);border-color:var(--bad)}
.fini{text-align:center;padding:28px 10px 10px;color:var(--ok)}
.fini h2{color:var(--ink);font-size:26px;margin:10px 0 4px}
.fini p{color:var(--ink);font-size:18px;margin:6px 0}
.thumbs.grandes img{width:140px;height:140px}
body.agent .gallery.grande img{max-height:24vh}
button.choix.vert{border-color:var(--ok);color:var(--ok)}
button.choix:disabled{opacity:.5}
h2.groupe{font-size:15px;text-transform:uppercase;letter-spacing:.03em;color:var(--navy);margin:18px 0 6px}
h2.groupe.rouge{color:var(--bad)}
.vignette.vide{background:#e8edf4}
.logo-ville{display:block;width:150px;height:auto;margin:22px auto 4px}
body.large .logo-ville{width:120px}
details.historique summary{font-weight:650;cursor:pointer;min-height:36px;display:flex;align-items:center}
body.agent .stat a.btn.mini{min-height:52px;font-size:17px;padding:8px 14px}
button.big.rep{min-height:60px;margin-top:8px}
.rondier.compact{padding:6px 12px}
.rondier.compact b{font-size:19px}
.nav-points{margin-top:8px;justify-content:space-between}
/* Planning */
.plan-scroll{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:#fff}
table.plan{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.plan th,table.plan td{border-right:1px solid #e3e7ee;border-bottom:1px solid #e3e7ee;text-align:center;padding:0}
table.plan th.nom{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:6px 10px;white-space:nowrap;font-weight:700;min-width:110px}
table.plan thead th{background:#f3f5f8;font-weight:600;padding:4px 0;min-width:34px;line-height:1.15}
table.plan thead th.we{background:#e9edf3}
table.plan thead th.hors,table.plan td.hors{opacity:.55}
table.plan thead th.pb{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)}
table.plan thead th.auj{box-shadow:inset 0 3px 0 var(--accent)}
table.plan td{height:34px;min-width:34px;cursor:pointer;font-weight:700;font-size:11px;color:#fff}
table.plan tr.interne th.nom{color:var(--muted);font-weight:500}
table.plan td.modif{box-shadow:inset 0 0 0 3px #ffb000}
table.plan td.claude{box-shadow:inset 0 0 0 3px #19c37d}
.pc-MAT{background:#0b63b6;color:#fff}.pc-MID{background:#7030a0;color:#fff}.pc-SOI{background:#c0262d;color:#fff}
.pc-R,.pc-vide{background:#fff;color:var(--muted)}
.pc-F{background:repeating-linear-gradient(45deg,#e6e9ee,#e6e9ee 4px,#f6f7f9 4px,#f6f7f9 8px);color:#5d6b7c}table.plan thead th.ferie{background:#dfe3ea;color:#5d6b7c;text-decoration:underline dotted}
.pc-CA{background:#f0a020;color:#fff}.pc-MAL{background:#6b7280;color:#fff}.pc-FOR{background:#0f8a7a;color:#fff}.pc-ABS{background:#8a5a2b;color:#fff}
.plan-legende{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.plan-legende .pc{padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.plan-legende .claude-ex{box-shadow:inset 0 0 0 3px #19c37d;background:#fff;color:var(--ink)}
.plan-legende .modif-ex{box-shadow:inset 0 0 0 3px #ffb000;background:#fff;color:var(--ink)}
.plan-choix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.plan-choix button.pc{min-height:52px;font-size:16px;justify-content:flex-start;border:2px solid transparent}
.plan-choix button.pc-R{border-color:var(--line)}
.plan-choix button.pc.on{outline:4px solid var(--accent);outline-offset:1px}
table.plan-h{border-collapse:collapse;font-size:14px}
table.plan-h th,table.plan-h td{padding:4px 10px;border-bottom:1px solid var(--line);text-align:left}
table.plan-h td.ok{color:var(--ok);font-weight:700}table.plan-h td.bad{color:var(--bad);font-weight:700}
.pa-jour h3{margin:0 0 8px;display:flex;gap:8px;align-items:center}
.pa-jour.auj{border:2px solid var(--accent)}
.pa-l{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;margin:4px 0;font-size:17px}
.pa-l .pa-v{font-weight:600;opacity:.95}
.pa-c{padding:2px 8px;border-radius:6px}
/* Contrôle de ronde : liste déroulante des thèmes */
.themes{display:flex;flex-direction:column;gap:10px}
.theme{background:#fff;border:2px solid var(--line);border-left-width:10px;border-radius:14px;overflow:hidden}
.theme.c{border-color:var(--ok);background:var(--ok-bg)}
.theme.nc{border-color:var(--bad);background:var(--bad-bg)}
.theme.na{border-color:#9aa5b4;background:#eef1f5}
.theme.afaire{border-left-color:var(--accent)}
.theme.ouvert{box-shadow:0 4px 14px rgba(29,53,87,.18)}
button.theme-tete{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;margin:0;padding:10px 14px;background:transparent;color:var(--ink);border:0;border-radius:0;text-align:left;justify-content:flex-start;font-size:20px;font-weight:700}
.theme-pastille{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}
.theme.c .theme-pastille{background:var(--ok);border-color:var(--ok)}
.theme.nc .theme-pastille{background:var(--bad);border-color:var(--bad)}
.theme.na .theme-pastille{background:#9aa5b4;border-color:#9aa5b4}
.theme-lbl{flex:1;min-width:0;line-height:1.2}
.theme-badge{flex:none;font-size:14px;font-weight:700;padding:3px 9px;border-radius:999px;background:#fff;border:1.5px solid var(--line);color:var(--muted)}
.theme.c .theme-badge{color:var(--ok);border-color:var(--ok)}
.theme.nc .theme-badge{color:var(--bad);border-color:var(--bad)}
.theme.afaire .theme-badge{color:var(--accent);border-color:var(--accent)}
.theme-chevron{flex:none;font-size:14px;color:var(--muted)}
.theme-corps{padding:0 14px 14px;background:#fff;border-top:1.5px solid var(--line)}
.theme-corps .point-detail{margin:12px 0 4px}
.theme-corps button.big{margin-top:10px}
button.ok.choisi{outline:4px solid #9fd8b6;outline-offset:2px}
@media (max-width:420px){.theme-badge{font-size:12px;padding:2px 7px} button.theme-tete{font-size:18px;gap:10px}}
.nav-points > *{flex:none;width:auto}
.resume b{font-size:18px}
.demande .sheet h3{font-size:22px}
.confirm-contact{position:fixed;inset:0;background:rgba(10,18,32,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.confirm-contact .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 20px;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.confirm-contact h3{margin:0 0 2px}
body.large .confirm-contact{align-items:center}
body.large .confirm-contact .sheet{border-radius:16px}
.courrier{display:inline-flex;align-items:center;gap:3px;color:var(--navy);vertical-align:middle;margin-left:4px}
.courrier b{font-size:12px;background:var(--bad);color:#fff;border-radius:99px;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center}
.courrier.alerte{color:var(--accent)}
.list-item.msg-new{border:2px solid var(--accent);background:#fff8f0}
.fil{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
.bulle{max-width:88%;align-self:flex-start;background:#eef2f7;border-radius:12px 12px 12px 4px;padding:8px 12px}
.bulle.moi{align-self:flex-end;background:#e3edf9;border-radius:12px 12px 4px 12px}
.bulle.demande{border:2px solid var(--accent)}
.bulle-tete{font-size:12px;color:#4a5568;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.bulle-txt{white-space:pre-wrap;margin-top:2px}
.fil-sys{align-self:center;font-size:12px;color:#4a5568;font-style:italic}
.reponse{border-top:1px solid var(--line);padding-top:6px}
.rondier{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff4e8;border:2px solid var(--accent);border-radius:12px;padding:8px 14px;margin:0 0 12px}
.rondier .small{color:#6b4a2b}
.rondier b{display:block;font-size:24px;line-height:1.15;color:var(--navy)}
.rondier{flex-wrap:wrap}
.rondier-btns{display:flex;gap:8px;width:100%}
.rondier-btns button{flex:1;min-height:44px;margin:0;font-size:15px;padding:6px 8px}
.lightbox{position:fixed;inset:0;background:rgba(8,12,20,.94);z-index:70;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:94vw;max-height:88vh;border-radius:6px}
.lightbox button{position:absolute;width:52px;min-height:52px;height:52px;border-radius:99px;background:rgba(255,255,255,.14);font-size:30px;padding:0;margin:0}
.lb-close{top:14px;right:14px}.lb-prev{left:14px;top:50%}.lb-next{right:14px;top:50%}
.lb-cpt{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:15px}
.btn.mini,button.mini{width:auto;min-height:40px;padding:6px 12px;margin:0;font-size:15px}
button.link.mini{min-height:34px;padding:2px 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:28px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi span{display:block;color:var(--muted);font-size:14px}
.kpi small{color:var(--muted);font-size:12px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:12px}
.chart-card h3{font-size:16px;margin:0 0 10px}
.chart-actions{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:6px}
table.tableau{width:100%;border-collapse:collapse;font-size:14px}
table.tableau th,table.tableau td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.tableau td+td,table.tableau th+th{text-align:right;font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.ctl:last-child{border-bottom:0}
.ctl-txt{flex:1;min-width:0}
.ctl-txt .badge{margin-left:0}
.ctl-btns{display:flex;flex-direction:column;gap:6px;flex:none;width:136px}
.ctl-btns button{margin:0;min-height:44px;padding:6px 8px;font-size:15px;background:#e8edf4;color:var(--ink)}
.ctl-btns button.sel-ras{background:var(--ok);color:#fff}
.ctl-btns button.sel-ano{background:var(--bad);color:#fff}
.ctl-btns button.link{background:none;color:var(--navy);min-height:32px;font-size:13px}
#print-area{display:none}
@media print{
  body > *:not(#print-area){display:none !important}
  #print-area{display:block !important}
  .print-page{page-break-after:always;text-align:center;padding:12mm;font-family:Arial,sans-serif}
  .print-page h1{font-size:30pt;margin:0 0 4mm;color:#000}
  .print-page p{font-size:14pt;margin:2mm 0}
  .print-page svg{width:120mm;height:120mm}
}
</style>
</head>
<body>
<div id="app"><main><p class="muted">Chargement…</p></main></div>
<div id="print-area"></div>
<noscript>Cette application nécessite JavaScript.</noscript>
<script src="lib/fflate.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script src="lib/xlsx.mini.min.js"></script>
<script src="lib/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
